name: CI — Security & Type Checks

# This workflow runs on PULL REQUESTS targeting main.
# It serves as the required status check for branch protection.
# The deploy.yml workflow only triggers on push-to-main (post-merge),
# so this is the actual gate that blocks broken code from merging.

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Security & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # ── Blocking checks — these MUST pass to merge ──────────────────────
      - name: Security regression tests
        run: pnpm exec vitest run tests/security/ --reporter=verbose

      - name: TypeScript type check (full project, blocking)
        run: pnpm exec tsc --noEmit

      - name: SERP competitive intelligence regression tests (blocking)
        run: >-
          pnpm exec vitest run
          tests/unit/serp-competitive-brief.test.ts
          tests/unit/information-gain.test.ts
          tests/unit/blog-pipeline-production.test.ts
          tests/unit/opportunity-serp-evidence.test.ts
          tests/unit/dataforseo-location.test.ts
          tests/unit/opportunity-gsc-evidence.test.ts
          tests/unit/growth-pipeline-gsc-gate.test.ts
          --reporter=verbose

      - name: Production Next.js build (blocking)
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/optiaiseo_ci
          NEXTAUTH_SECRET: ci-build-only-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # ── Informational checks — failures logged but don't block merge ────
      - name: Unit tests (informational)
        run: pnpm exec vitest run tests/unit/ --reporter=verbose
        continue-on-error: true  # Some unit tests need DB fixtures not in CI
