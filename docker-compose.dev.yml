version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: aiseo
      POSTGRES_PASSWORD: aiseo
      POSTGRES_DB: aiseo_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  db_data:
